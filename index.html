<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infiltrómetro Master v16 - Galería</title>
    <!-- Librerías -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --primary: #007bff; --stop: #ff9800; --reset: #dc3545; --bg: #f4f7f9; --text: #333; --success: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--text); }
        
        /* HEADER FIJO */
        .header-timer { position: sticky; top: 0; z-index: 1000; background: #1a1a1a; color: #00ff00; text-align: center; padding: 10px; border-bottom: 3px solid #333; }
        #timer-display { font-size: 3.5em; font-family: monospace; font-weight: bold; margin: 2px 0; }
        .timer-controls { display: flex; gap: 8px; justify-content: center; padding: 5px 10px; }
        .btn-t { flex: 1; padding: 12px 5px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; text-transform: uppercase; font-size: 0.8em; }
        .btn-start { background: var(--success); }
        .btn-stop { background: var(--stop); }
        .btn-reset { background: var(--reset); }

        .container { padding: 15px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
        
        /* ESTACIONES */
        .station-item { background: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; border-left: 8px solid var(--primary); display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; }
        .station-info { flex-grow: 1; }
        .status-pill { font-size: 0.65em; padding: 2px 6px; border-radius: 4px; background: #eee; font-weight: bold; }
        .status-pill.active { background: var(--success); color: white; }

        /* TABLA */
        .table-container { overflow-x: auto; background: white; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; min-width: 300px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px 4px; text-align: center; }
        th { background: #f8f9fa; font-size: 0.7em; color: #888; text-transform: uppercase; }
        input { width: 85%; padding: 10px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 1.1em; text-align: center; }
        .row-target { background: #e8f0fe !important; outline: 2px solid var(--primary); }
        .row-refill { background: #fff9e6 !important; font-weight: bold; }

        /* GALERÍA DE FOTOS */
        .gallery { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .photo-wrapper { position: relative; flex-shrink: 0; }
        .photo-thumb { width: 90px; height: 90px; border-radius: 8px; object-fit: cover; border: 2px solid #ddd; }
        .btn-del-photo { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 22px; height: 22px; border: none; font-size: 12px; cursor: pointer; }
        .btn-add-photo { background: #6c757d; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .hidden { display: none; }
        .btn-main { width: 100%; padding: 18px; font-size: 1.1em; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(0,123,255,0.25); }

        /* TOGGLE SWITCH */
        .settings-card { background: white; padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>
</head>
<body>

<div id="home-screen">
    <div style="background: #333; color: white; padding: 18px; text-align: center; font-weight: bold;">INFILTRÓMETRO PRO V16</div>
    <div class="container">
        <button class="btn-main" onclick="createNewStation()">+ NUEVO PUNTO DE MEDICIÓN</button>
        <div id="station-list"></div>

        <div class="settings-card">
            <div style="font-size: 0.9em;"><strong>⏱️ Multitarea</strong><br><small style="color:#777">Tiempo corre en 2do plano</small></div>
            <label class="switch">
                <input type="checkbox" id="bg-timer-toggle" onchange="saveSettings()" checked>
                <span class="slider"></span>
            </label>
        </div>

        <button onclick="packageAllData()" style="width: 100%; padding: 16px; background: #444; color: white; border: none; border-radius: 10px; font-weight: bold; margin-top: 20px;">📦 EXPORTAR PROYECTO (ZIP)</button>
    </div>
</div>

<div id="measurement-screen" class="hidden">
    <div class="header-timer">
        <div style="display:flex; justify-content: space-between; font-size: 0.7em; padding-bottom: 5px; align-items: center;">
            <span onclick="goToHome()" style="background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 5px; color: #5fb0ff; font-weight: bold; cursor: pointer;">⬅ VOLVER</span>
            <span id="active-station-name">---</span>
            <span id="target-label" style="color: #00ff00; font-weight: bold;">OBJ: --</span>
        </div>
        <div id="timer-display">00:00</div>
        <div class="timer-controls">
            <button class="btn-t btn-start" onclick="uiTimerStart()">Iniciar</button>
            <button class="btn-t btn-stop" onclick="uiTimerStop()">Detener</button>
            <button class="btn-t btn-reset" onclick="uiTimerReset()">Restablecer</button>
        </div>
    </div>

    <div class="container">
        <!-- SECCIÓN DE GALERÍA -->
        <div class="card">
            <div id="photo-gallery" class="gallery">
                <!-- Miniaturas aparecerán aquí -->
            </div>
            <input type="file" id="camera-input" accept="image/*" capture="camera" class="hidden" onchange="handlePhotoCapture(this)">
            <button class="btn-add-photo" onclick="document.getElementById('camera-input').click()">📸 AÑADIR FOTO AL PUNTO</button>
        </div>

        <div class="table-container">
            <table id="measure-table">
                <thead><tr><th>ID</th><th>Tiempo (m)</th><th>Lectura (cm)</th><th>Tipo</th></tr></thead>
                <tbody id="measure-body"></tbody>
            </table>
        </div>
        <button onclick="addNewRow()" style="width:100%; padding:18px; margin-top:12px; background:var(--primary); color:white; border:none; border-radius:12px; font-weight:bold;">+ AÑADIR CASILLA</button>
        <button onclick="deleteStation()" style="width:100%; padding:10px; margin-top:30px; background:none; color:red; border:1px solid red; border-radius:10px; font-size:0.8em;">ELIMINAR PUNTO</button>
    </div>
</div>

<script>
    let stations = [];
    let currentIdx = null;
    let audioCtx = null;
    let settings = JSON.parse(localStorage.getItem('soil_v16_settings')) || { bgTimers: true };

    // --- BASE DE DATOS INDEXED DB ---
    const dbName = "InfiltrometerV16DB";
    let db;

    const request = indexedDB.open(dbName, 1);
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        db.createObjectStore("stations", { keyPath: "id", autoIncrement: true });
    };
    request.onsuccess = (e) => {
        db = e.target.result;
        loadFromDB();
    };

    function loadFromDB() {
        const store = db.transaction(["stations"], "readonly").objectStore("stations");
        store.getAll().onsuccess = (e) => {
            stations = e.target.result || [];
            renderHistory();
            startGlobalTicker();
        };
    }

    function saveToDB(station) {
        db.transaction(["stations"], "readwrite").objectStore("stations").put(station);
    }

    // --- AUDIO ---
    function playBip(freq, duration) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.value = 0.3;
            osc.start();
            setTimeout(() => osc.stop(), duration);
        } catch(e) {}
    }

    // --- CRONÓMETRO ---
    function startGlobalTicker() {
        setInterval(() => {
            const now = Date.now();
            stations.forEach((s, i) => {
                if (s.isRunning && s.startTime) {
                    s.seconds = Math.floor((now - s.startTime) / 1000);
                    const target = getTargetData(i);
                    if (target) {
                        const targetSecs = target.accumulatedMin * 60;
                        if (s.seconds === targetSecs - 10) { playBip(600, 200); if(navigator.vibrate) navigator.vibrate(200); }
                        if (s.seconds === targetSecs) { playBip(880, 1500); if(navigator.vibrate) navigator.vibrate([400,200,400]); }
                    }
                }
            });
            if (currentIdx !== null) updateUI();
        }, 1000);
    }

    // --- GESTIÓN DE PUNTOS ---
    function createNewStation() {
        const name = prompt("Nombre del punto:", "Punto " + (stations.length + 1));
        if (!name) return;
        const newStation = {
            id: Date.now(),
            name: name,
            rows: Array.from({length: 11}, (_, i) => ({ 
                time: i === 0 ? 0 : (i <= 5 ? 1 : 5), 
                value: "", 
                type: i === 0 ? "INICIAL" : "NORMAL" 
            })),
            seconds: 0, isRunning: false, startTime: null, isPendingRefill: false,
            photos: [] // Array para múltiples fotos
        };
        stations.push(newStation);
        saveToDB(newStation);
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('station-list');
        list.innerHTML = "";
        stations.forEach((s) => {
            const div = document.createElement('div');
            div.className = 'station-item';
            div.onclick = () => openStation(s.id);
            div.innerHTML = `
                <div class="station-info">
                    <strong>${s.name}</strong> 
                    <span class="status-pill ${s.isRunning ? 'active' : ''}">${s.isRunning ? 'ACTIVO' : 'STOP'}</span>
                    <br><small>Mediciones: ${s.rows.filter(r=>r.value).length} | Fotos: ${s.photos.length}</small>
                </div>
                <div style="font-size:1.2em" onclick="event.stopPropagation(); renameStation(${s.id})">✏️</div>
            `;
            list.appendChild(div);
        });
    }

    function openStation(id) {
        currentIdx = stations.findIndex(s => s.id === id);
        const s = stations[currentIdx];
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('measurement-screen').classList.remove('hidden');
        document.getElementById('active-station-name').innerText = s.name;
        renderGallery();
        renderTable();
    }

    // --- FOTOS ---
    function handlePhotoCapture(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const max_size = 1000; 
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > max_size) { h *= max_size / w; w = max_size; } }
                    else { if (h > max_size) { w *= max_size / h; h = max_size; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    
                    stations[currentIdx].photos.push(dataUrl);
                    saveToDB(stations[currentIdx]);
                    renderGallery();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function renderGallery() {
        const container = document.getElementById('photo-gallery');
        container.innerHTML = "";
        stations[currentIdx].photos.forEach((photo, i) => {
            const div = document.createElement('div');
            div.className = "photo-wrapper";
            div.innerHTML = `
                <img src="${photo}" class="photo-thumb">
                <button class="btn-del-photo" onclick="deletePhoto(${i})">✕</button>
            `;
            container.appendChild(div);
        });
    }

    function deletePhoto(photoIdx) {
        if(confirm("¿Eliminar esta foto?")) {
            stations[currentIdx].photos.splice(photoIdx, 1);
            saveToDB(stations[currentIdx]);
            renderGallery();
        }
    }

    // --- TABLA ---
    function renderTable() {
        const body = document.getElementById('measure-body');
        const s = stations[currentIdx];
        body.innerHTML = "";
        const target = getTargetData(currentIdx);
        let mC = 0; let reC = 0;

        s.rows.forEach((row, i) => {
            let label = i === 0 ? "M0" : (row.type === "NORMAL" ? "M" + (++mC) : "RE" + String(++reC).padStart(2,'0'));
            const tr = document.createElement('tr');
            if (row.type === "RELLENO") tr.className = "row-refill";
            if (target && i === target.index) tr.className += " row-target";
            tr.innerHTML = `
                <td style="font-size:0.75em; font-weight:bold;">${label}</td>
                <td><input type="number" value="${row.time}" onchange="updateCell(${i},'time',this.value)"></td>
                <td><input type="number" step="any" inputmode="decimal" value="${row.value}" oninput="updateCell(${i},'value',this.value, false)"></td>
                <td style="font-size:0.65em; color:#888">${row.type}</td>
            `;
            body.appendChild(tr);
        });
        document.getElementById('target-label').innerText = target ? `${target.label} en ${target.accumulatedMin}m` : "FIN";
    }

    function updateCell(idx, field, val, redraw = true) {
        stations[currentIdx].rows[idx][field] = val;
        saveToDB(stations[currentIdx]);
        if (redraw) renderTable();
    }

    function getTargetData(sIdx) {
        const s = stations[sIdx];
        const idx = s.rows.findIndex((r, i) => i > 0 && r.value === "" && r.type === "NORMAL");
        if (idx === -1) return null;
        let acc = 0, mC = 0, label = "", lastZero = 0;
        for (let i = 0; i < idx; i++) { if (s.rows[i].time == 0) lastZero = i; }
        for (let i = 0; i < s.rows.length; i++) {
            if (i > 0 && s.rows[i].type === "NORMAL") mC++;
            if (i > lastZero && i <= idx) acc += parseFloat(s.rows[i].time || 0);
            if (i === idx) label = "M" + mC;
        }
        return { index: idx, accumulatedMin: acc, label: label };
    }

    // --- BOTONES ---
    function uiTimerStart() {
        playBip(440, 50);
        const s = stations[currentIdx];
        if (s.isRunning) return;
        s.isRunning = true;
        s.startTime = Date.now() - (s.seconds * 1000);
        s.isPendingRefill = false;
        saveToDB(s);
    }

    function uiTimerStop() {
        const s = stations[currentIdx];
        s.isRunning = false; s.startTime = null; s.isPendingRefill = true;
        saveToDB(s);
        playBip(300, 200);
    }

    function uiTimerReset() {
        const s = stations[currentIdx];
        if (s.isPendingRefill) {
            let targetIdx = s.rows.findIndex((r, i) => i > 0 && r.value === "" && r.type === "NORMAL");
            if (targetIdx !== -1) s.rows.splice(targetIdx, 0, { time: 0, value: "", type: "RELLENO" });
            s.isPendingRefill = false;
        }
        s.isRunning = false; s.seconds = 0; s.startTime = null;
        saveToDB(s);
        renderTable(); updateUI();
    }

    function updateUI() {
        const s = stations[currentIdx];
        const m = Math.floor(s.seconds / 60);
        const sec = s.seconds % 60;
        document.getElementById('timer-display').innerText = `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    }

    function goToHome() {
        if (!settings.bgTimers) stations.forEach(s => { s.isRunning = false; s.startTime = null; });
        currentIdx = null;
        document.getElementById('measurement-screen').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
        renderHistory();
    }

    function renameStation(id) {
        const idx = stations.findIndex(s => s.id === id);
        const n = prompt("Nuevo nombre:", stations[idx].name);
        if(n) { stations[idx].name = n; saveToDB(stations[idx]); renderHistory(); }
    }

    function deleteStation() {
        if(confirm("¿Eliminar punto definitivamente?")) {
            const id = stations[currentIdx].id;
            db.transaction(["stations"], "readwrite").objectStore("stations").delete(id).onsuccess = () => {
                stations.splice(currentIdx, 1);
                goToHome();
            };
        }
    }

    function addNewRow() {
        stations[currentIdx].rows.push({ time: 15, value: "", type: "NORMAL" });
        saveToDB(stations[currentIdx]);
        renderTable();
    }

    function saveSettings() {
        settings.bgTimers = document.getElementById('bg-timer-toggle').checked;
        localStorage.setItem('soil_v16_settings', JSON.stringify(settings));
    }

    // --- ZIP EXPORT ---
    async function packageAllData() {
        if (stations.length === 0) return alert("Sin datos.");
        const zip = new JSZip();
        const wb = XLSX.utils.book_new();
        const photosFolder = zip.folder("Fotos_Proyecto");

        stations.forEach(s => {
            // Excel
            const excelData = [["Estación:", s.name], ["ID", "Tiempo (m)", "Lectura (cm)", "Tipo"]];
            let mC = 0, reC = 0;
            s.rows.forEach((r, i) => {
                let lbl = i === 0 ? "M0" : (r.type === "NORMAL" ? "M" + (++mC) : "RE" + String(++reC).padStart(2,'0'));
                excelData.push([lbl, r.time, r.value, r.type]);
            });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(excelData), s.name.substring(0,30));

            // Fotos
            s.photos.forEach((p, idx) => {
                const base64 = p.split(',')[1];
                photosFolder.file(`${s.name.replace(/\s/g, '_')}_Foto${idx+1}.jpg`, base64, {base64: true});
            });
        });

        zip.file("Datos_Infiltracion.xlsx", XLSX.write(wb, {bookType:'xlsx', type:'array'}));
        const content = await zip.generateAsync({type:"blob"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = `Infiltracion_Suelos_${new Date().toISOString().slice(0,10)}.zip`;
        a.click();
    }
</script>
</body>
</html>
